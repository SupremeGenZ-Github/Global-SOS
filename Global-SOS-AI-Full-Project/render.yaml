services:
  - type: web
    name: global-sos-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_REVIEW_TOKEN
        generateValue: true
      - key: ADMIN_PUBLISH_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: none
      - key: DIRECTORY_UPDATE_INTERVAL
        value: '86400'
      - key: MONITOR_CONTACT
        sync: false
