name: Global SOS v5 checks and Android build
on:
  push:
    branches: [codex/global-sos-v5-release]
    paths-ignore:
      - 'Global-SOS-AI-Full-Project/releases/android/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: Global-SOS-AI-Full-Project
jobs:
  web-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
      - name: Browser SOS checks with mocked delivery
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/ui-smoke.mjs
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - run: sdkmanager 'platforms;android-36' 'platforms;android-35' 'platforms;android-34' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: chmod +x android/android/gradlew
      - run: flutter pub get --enforce-lockfile
        working-directory: Global-SOS-AI-Full-Project/android
      - run: flutter analyze
        working-directory: Global-SOS-AI-Full-Project/android
      - run: flutter test
        working-directory: Global-SOS-AI-Full-Project/android
      - run: flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL=https://global-sos.onrender.com
        working-directory: Global-SOS-AI-Full-Project/android
      - run: flutter build appbundle --release --target-platform android-arm64 --dart-define=API_BASE_URL=https://global-sos.onrender.com
        working-directory: Global-SOS-AI-Full-Project/android
      - name: Verify artifacts
        run: |
          mkdir -p artifacts
          cp android/build/app/outputs/flutter-apk/app-release.apk artifacts/Global-SOS-v5-TEST-SIGNED.apk
          cp android/build/app/outputs/bundle/release/app-release.aab artifacts/Global-SOS-v5-TEST-SIGNED.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Global-SOS-v5-TEST-SIGNED.apk
          jarsigner -verify artifacts/Global-SOS-v5-TEST-SIGNED.aab
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Package website with verified v5 APK
        env:
          PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/Global-SOS-AI-Full-Project/artifacts/packages
        run: |
          npm ci --include=dev
          node scripts/stage-ci-release.mjs artifacts/Global-SOS-v5-TEST-SIGNED.apk
          npm test
          npm run build
          node scripts/verify-public-download.mjs
          node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Global-SOS-v5-Android
          path: Global-SOS-AI-Full-Project/artifacts/
          if-no-files-found: error
      - name: Commit verified website download to the v5 release branch
        if: github.ref == 'refs/heads/codex/global-sos-v5-release' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- releases/android
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage verified v5 APK for the website"
          git push origin HEAD:refs/heads/codex/global-sos-v5-release
